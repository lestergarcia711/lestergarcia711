<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <style>
    .hola { animation: pop 1.2s ease-out both; transform-origin: 0 0; }
    .name { animation: rise 1.4s ease-out 0.5s both; }
    .epic { animation: rise 1.6s ease-out 1.2s both; }
    .hand { transform-box: fill-box; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out 1s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10% { transform: rotate(18deg); } 20% { transform: rotate(-10deg); } 30% { transform: rotate(18deg); } 40% { transform: rotate(-8deg); } 50% { transform: rotate(12deg); } }
  </style>
  <g class="hola">
    <text id="line" x="600" y="86" font-size="62" font-weight="900" text-anchor="middle" fill="url(#t)">¡Hola! Soy Lester Garcia</text>
  </g>
  <text class="hand" id="hand" x="1000" y="82" font-size="64">👋</text>
  <text class="epic" x="600" y="146" font-size="20" font-weight="500" text-anchor="middle" fill="#8fe9d0" letter-spacing="1.5">BIENVENIDO A MI UNIVERSO DE CÓDIGO: AQUÍ CADA LÍNEA CONSTRUYE FUTURO</text>
</svg>
