<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" preserveAspectRatio="none">
  <style>
    .cy { stop-color: #0284c7; }
    .gr { stop-color: #15803d; }
    .ye { stop-color: #a16207; }
    .sub { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .cy { stop-color: #00e5ff; }
      .gr { stop-color: #22c55e; }
      .ye { stop-color: #facc15; }
      .sub { fill: #8fe9d0; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" class="cy"/>
      <stop offset="0.25" class="gr"/>
      <stop offset="0.5" class="ye"/>
      <stop offset="0.75" class="gr"/>
      <stop offset="1" class="cy"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect y="4" width="1200" height="4" rx="2" fill="url(#g)"/>
</svg>
