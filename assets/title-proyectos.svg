<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 64" width="700" height="64" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <style>
    .cy { stop-color: #0284c7; }
    .gr { stop-color: #15803d; }
    .ye { stop-color: #a16207; }
    .sub { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .cy { stop-color: #00e5ff; }
      .gr { stop-color: #22c55e; }
      .ye { stop-color: #c9b458; }
      .sub { fill: #8fe9d0; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="ye"/>
      <stop offset="0.5" class="gr"/>
      <stop offset="1" class="cy"/>
    </linearGradient>
  </defs>
  <text x="350" y="46" font-size="40" font-weight="900" text-anchor="middle" fill="url(#g)">Proyectos destacados</text>
</svg>
